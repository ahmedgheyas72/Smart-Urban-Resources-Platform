spring.application.name=resource-service
server.port=8081

# Database - reads from Azure App Service environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://smarturban-db.postgres.database.azure.com:5432/smarturban?sslmode=require}
spring.datasource.username=${DB_USERNAME:smarturbanadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Suppress default UserDetailsService — JWT auth handles all authentication
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Error handling
server.error.include-binding-errors=always
server.error.include-message=always
